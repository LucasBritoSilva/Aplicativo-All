# Validação a cada envio: análise, testes e APK de teste.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Código do banco (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      # Sem a chave de produção (que nunca fica no repositório), o APK sai
      # assinado com uma chave de debug descartável: serve só para teste.
      - name: APK de teste
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: all-apk-de-teste
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
