# Memória do Gradle limitada a 4 GB (o PC tem 8 GB; o modelo pedia 8 GB).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# A pasta do projeto tem acentos ("Programação"). O Android Gradle Plugin
# bloqueia caminhos com caracteres não-ASCII no Windows; esta linha libera.
# Se mesmo assim o build falhar, use o gerar_apk.bat (ele usa uma unidade
# virtual sem acentos). Ver DECISOES.md.
android.overridePathCheck=true
# O gerar_apk.bat compila a partir de uma unidade virtual (ex.: P:), e o
# cache de pacotes fica em C:. A compilação incremental do Kotlin falha com
# arquivos em unidades diferentes, então ela fica desligada.
kotlin.incremental=false
