name: aplicativo_all
description: "BrutAll: organização pessoal em 21 módulos (somente Android, offline)."
publish_to: 'none'

version: 3.0.0+3

environment:
  sdk: ^3.13.7

# Dependências do app (ver docs/DECISOES.md). Sem serviços em nuvem: o
# backup no Google Drive foi removido na versão final.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^23.0.1
  flutter_riverpod: ^3.5.0
  permission_handler: ^13.0.2
  speech_to_text: ^7.5.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Geração do código do banco (drift).
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  assets:
    # Logotipo do BrutAll (cabeçalho do menu lateral).
    - assets/brand/brutall.png
